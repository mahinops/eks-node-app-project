replicaCount: 1

image:
  repository: docker.io/mahin96/eks-node-app-project
  pullPolicy: IfNotPresent
  tag: "main-cf96224-22-09-04-05-2026"

nameOverride: ""
fullnameOverride: ""


service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
readinessProbe:
  httpGet:
    path: /health
    port: http

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

podAnnotations: {}
podLabels: {}