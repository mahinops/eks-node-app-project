name: Deploy to Kubernetes

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name (used to fetch latest image)"
        required: false
      tag:
        description: "Exact image tag (optional, overrides branch)"
        required: false

env:
  IMAGE_NAME: eks-node-app-project

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Decide image tag
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "Using provided tag"
            FINAL_TAG="${{ github.event.inputs.tag }}"
          
          elif [ -n "${{ github.event.inputs.branch }}" ]; then
            echo "Fetching latest tag for branch"

            BRANCH=$(echo "${{ github.event.inputs.branch }}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')

            TAGS_JSON=$(curl -s "https://hub.docker.com/v2/repositories/${{ vars.DOCKERHUB_USERNAME }}/$IMAGE_NAME/tags?page_size=100&ordering=last_updated")
            if ! echo "$TAGS_JSON" | jq -e '.results' > /dev/null 2>&1; then
              echo "ERROR: DockerHub API did not return expected results. Response:"
              echo "$TAGS_JSON"
              exit 1
            fi

            FINAL_TAG=$(echo "$TAGS_JSON" | jq -r '.results[].name' | grep "^$BRANCH-" | head -n 1)
            if [ -z "$FINAL_TAG" ]; then
              echo "ERROR: No tags found for branch '$BRANCH'"
              exit 1
            fi

          else
            echo "ERROR: Either tag or branch must be provided"
            exit 1
          fi

          echo "Resolved tag: $FINAL_TAG"
          echo "final_tag=$FINAL_TAG" >> $GITHUB_OUTPUT

      - name: Print resolved image
        run: |
          echo "Image Tag: ${{ steps.resolve.outputs.final_tag }}"

      - name: Install Helm, Helmfile and Helm Diff Plugin
        run: |
          # Install Helm
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

          # Install Helm Diff Plugin
          helm plugin add https://github.com/databus23/helm-diff

          # Install Helmfile
          HELMFILE_VERSION="0.159.0"  # Update to the latest version
          HELMFILE_URL="https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz"
          curl -Lo helmfile.tar.gz $HELMFILE_URL
          tar xzf helmfile.tar.gz -C /tmp
          sudo mv /tmp/helmfile /usr/local/bin/
          chmod +x /usr/local/bin/helmfile
          rm helmfile.tar.gz

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Helm Template
        env:
          tag: ${{ steps.resolve.outputs.final_tag }}
        run: |
          cd deployment
          helmfile template

      # - name: Helm Diff
      #   env:
      #     tag: ${{ steps.resolve.outputs.final_tag }}
      #   run: |
      #     cd deployment
      #     helmfile diff

      